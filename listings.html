<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Find My Artisan — Listings</title>
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/listings.css" />
</head>
<body>

  <div class="listings-page">
    <h1>Find Skilled Artisans</h1>

    <input
      type="text"
      id="search-input"
      class="search-input"
      placeholder="Search artisans..."
    />

    <div class="filter-container" id="filter-container">
      <!-- filter buttons are rendered by JS so the "active" class
           logic lives in one place (listings.js), same as FilterButtons.jsx -->
    </div>

    <div class="worker-grid" id="worker-grid">
      <!-- skeleton cards shown first, then replaced by real cards or
           a "no artisans found" message — mirrors ListingsPage.jsx -->
    </div>
  </div>

  <script src="js/mockData.js"></script>
  <script src="js/listings.js"></script>
</body>
</html>
